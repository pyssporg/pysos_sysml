name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        # The version lives in src/pysos_sysml/__init__.py, so the guard below
        # reads it there and no install is required to build.
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(awk -F'"' '/^__version__ = / { print $2; exit }' src/pysos_sysml/__init__.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version ${version}." >&2
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pysos_sysml; print(pysos_sysml.__version__)"
          /tmp/smoke/bin/pysos-sysml --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
