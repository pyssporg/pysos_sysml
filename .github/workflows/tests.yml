name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest -m "not slow"

      - name: Boundaries hold
        run: |
          python - <<'PY'
          import sys
          import pycps_sysml2
          import pysos_sysml
          assert pycps_sysml2.__version__ == "0.2.0"
          assert "pysos_coordinate" not in sys.modules, "manifest owner must not be imported"
          heavy = {"numpy", "matplotlib", "pint"} & set(sys.modules)
          assert not heavy, f"setup layer imported {sorted(heavy)}"
          PY

      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
